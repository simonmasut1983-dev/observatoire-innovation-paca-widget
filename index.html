<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fiche projet — Observatoire de l'innovation PACA</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #172036;
      --muted: #667085;
      --line: #dce3ec;
      --surface: #ffffff;
      --surface-soft: #f6f8fb;
      --accent: #0b6bcb;
      --accent-soft: #eaf3ff;
      --shadow: 0 12px 32px rgba(23, 32, 54, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f3f6fa;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { padding: 14px; }

    .card {
      width: min(100%, 900px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card__header {
      padding: 24px 26px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #ffffff 0%, #f6faff 100%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 24ch;
      font-size: clamp(27px, 4.3vw, 44px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta span:empty { display: none; }

    .card__body {
      display: grid;
      gap: 22px;
      padding: 22px 26px 28px;
    }

    .section { min-width: 0; }

    .section__title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 30px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid #c8dcf5;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #174e86;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }

    .empty-inline {
      color: #98a2b3;
      font-size: 13px;
      font-style: italic;
    }

    .photo-frame {
      position: relative;
      display: grid;
      min-height: 250px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(11, 107, 203, 0.04), transparent 52%),
        var(--surface-soft);
      isolation: isolate;
    }

    .photo-frame img {
      width: 100%;
      height: clamp(250px, 42vw, 470px);
      object-fit: contain;
      background: #eef2f6;
    }

    .photo-frame__empty,
    .loading {
      place-self: center;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .photo-frame__empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--ink);
      font-size: 15px;
    }

    .photo-controls {
      position: absolute;
      inset: auto 10px 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .photo-controls button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 50%;
      background: rgba(23,32,54,0.78);
      color: white;
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }

    .photo-count {
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(23,32,54,0.78);
      color: white;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .author {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 14px 15px;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      background: var(--surface-soft);
      color: #344054;
      font-size: 14px;
      line-height: 1.5;
    }

    .description {
      margin: 0;
      color: #344054;
      font-size: 15px;
      line-height: 1.68;
      white-space: pre-line;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .address {
      color: var(--muted);
      font-size: 13px;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
    }

    .source-link:hover { background: #0758aa; }
    .source-link:focus-visible, button:focus-visible { outline: 3px solid #9ecbff; outline-offset: 2px; }
    [hidden] { display: none !important; }

    @media (max-width: 560px) {
      body { padding: 0; }
      .card { border: 0; border-radius: 0; box-shadow: none; }
      .card__header { padding: 20px 18px 17px; }
      .card__body { padding: 18px; gap: 19px; }
      .photo-frame { min-height: 210px; }
      .photo-frame img { height: 260px; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="card"><div class="loading">Sélectionnez un projet sur la carte pour afficher sa fiche.</div></div>
  </main>

  <script>
    const columns = [
      { name: 'Title', title: 'Titre', type: 'Text' },
      { name: 'Keywords', title: 'Mots-clés', optional: true },
      { name: 'Photos', title: 'Images du projet', type: 'Attachments', optional: true },
      { name: 'Author', title: 'Auteur', type: 'Text', optional: true },
      { name: 'ProjectDate', title: 'Date', optional: true },
      { name: 'Description', title: 'Description', type: 'Text', optional: true },
      { name: 'Address', title: 'Adresse', type: 'Text', optional: true },
      { name: 'SourceUrl', title: 'Lien vers la source', type: 'Text', optional: true },
      { name: 'Identifier', title: 'Identifiant', optional: true }
    ];

    const app = document.getElementById('app');
    let currentPhoto = 0;

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function listValue(value) {
      if (value == null || value === '') return [];
      if (Array.isArray(value)) {
        const values = value[0] === 'L' ? value.slice(1) : value;
        return values.flat(Infinity).filter((item) => item != null && item !== '' && item !== 'L');
      }
      return String(value).split(/[,;\n]/).map((item) => item.trim()).filter(Boolean);
    }

    function validUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
      } catch { return ''; }
    }

    function renderPhoto(index) {
      const images = Array.from(document.querySelectorAll('.photo-frame img'));
      if (!images.length) return;
      currentPhoto = (index + images.length) % images.length;
      images.forEach((image, imageIndex) => { image.hidden = imageIndex !== currentPhoto; });
      const count = document.querySelector('.photo-count');
      if (count) count.textContent = (currentPhoto + 1) + ' / ' + images.length;
    }

    async function attachmentUrls(photoIds) {
      if (!photoIds.length) return [];
      try {
        const tokenInfo = await grist.docApi.getAccessToken({ readOnly: true });
        return photoIds.map((id) =>
          tokenInfo.baseUrl + '/attachments/' + encodeURIComponent(id) + '/download?auth=' + encodeURIComponent(tokenInfo.token)
        );
      } catch (error) {
        console.error('Impossible de charger les pièces jointes', error);
        return [];
      }
    }

    async function render(record) {
      if (!record) {
        app.innerHTML = '<div class="card"><div class="loading">Sélectionnez un projet sur la carte pour afficher sa fiche.</div></div>';
        return;
      }

      const data = grist.mapColumnNames(record) || {};
      const title = data.Title || 'Projet sans titre';
      const keywords = listValue(data.Keywords);
      const photoIds = listValue(data.Photos).filter((id) => Number.isFinite(Number(id))).map(Number);
      const photos = await attachmentUrls(photoIds);
      const author = data.Author || '';
      const date = data.ProjectDate || '';
      const description = data.Description || '';
      const address = data.Address || '';
      const source = validUrl(data.SourceUrl);
      const identifier = data.Identifier || record.id || '';

      const chips = keywords.length
        ? keywords.map((keyword) => '<span class="chip">' + escapeHtml(keyword) + '</span>').join('')
        : '<span class="empty-inline">Aucun mot-clé renseigné</span>';

      const photoMarkup = photos.length
        ? photos.map((src, index) => '<img src="' + escapeHtml(src) + '" alt="Illustration du projet ' + escapeHtml(title) + '"' + (index ? ' hidden' : '') + ' />').join('') +
          (photos.length > 1 ? '<div class="photo-controls"><button type="button" class="photo-prev" aria-label="Image précédente">‹</button><span class="photo-count">1 / ' + photos.length + '</span><button type="button" class="photo-next" aria-label="Image suivante">›</button></div>' : '')
        : '<div class="photo-frame__empty"><strong>Aucune image disponible</strong><span>Une photographie pourra être ajoutée à la table Images_Projet.</span></div>';

      app.innerHTML =
        '<article class="card">' +
          '<header class="card__header">' +
            '<p class="eyebrow">Observatoire de l’innovation PACA</p>' +
            '<h1>' + escapeHtml(title) + '</h1>' +
            '<div class="meta"><span>' + (date ? 'Année : ' + escapeHtml(date) : '') + '</span><span>' + (identifier ? 'Réf. ' + escapeHtml(identifier) : '') + '</span></div>' +
          '</header>' +
          '<div class="card__body">' +
            '<section class="section"><h2 class="section__title">Mots-clés</h2><div class="chips">' + chips + '</div></section>' +
            '<section class="section"><h2 class="section__title">Images du projet</h2><div class="photo-frame">' + photoMarkup + '</div></section>' +
            '<section class="section"' + (author ? '' : ' hidden') + '><h2 class="section__title">Auteur</h2><div class="author">' + escapeHtml(author) + '</div></section>' +
            '<section class="section"' + (description ? '' : ' hidden') + '><h2 class="section__title">Présentation du projet</h2><p class="description">' + escapeHtml(description) + '</p></section>' +
            '<footer class="footer"><span class="address">' + escapeHtml(address) + '</span>' +
              (source ? '<a class="source-link" href="' + escapeHtml(source) + '" target="_blank" rel="noopener noreferrer">Consulter la fiche source</a>' : '') +
            '</footer>' +
          '</div>' +
        '</article>';

      document.querySelector('.photo-prev')?.addEventListener('click', () => renderPhoto(currentPhoto - 1));
      document.querySelector('.photo-next')?.addEventListener('click', () => renderPhoto(currentPhoto + 1));
      currentPhoto = 0;
    }

    grist.ready({ requiredAccess: 'read table', allowSelectBy: true, columns });
    grist.onRecord((record) => { render(record).catch((error) => {
      console.error(error);
      app.innerHTML = '<div class="card"><div class="loading">La fiche n’a pas pu être affichée.</div></div>';
    }); });
  </script>
</body>
</html>
